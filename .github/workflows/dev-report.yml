# ============================================================
# Dev report
#
# 目的  : master に入ったコミットを毎日 AI にレビューさせ、週に一度は活動を
#         総括して、Discord に投稿する。中身は .github/scripts/dev-report.py。
# 経緯  : 以前は別リポジトリ noxitro/discord-dev-report で動かしていたが、
#         使っていた GitHub Models が 2026-07-30 に提供終了し、2026-09-06 以降は
#         毎回失敗していた。ここへ移して、PAT も private の Actions 枠も不要にした。
# 日程  : 日次 JST 01:07 / 週次 月曜 JST 01:17 (schedule は既定ブランチでしか動かない)。
#         GitHub の schedule は混雑時に遅れるので、ちょうど 0 分を避けている。
# 検証  : このワークフローかスクリプトを変えた push では dry-run で走らせる
#         (投稿も状態の更新もしない。内容はジョブのサマリーで見られる)。
#         有料の Claude は push の dry-run では呼ばない (無料の Gemini だけ)。
# 状態  : 日次・週次それぞれ「前回レポートした master の地点」を actions/cache に
#         保存し、次回はそこから今までを対象にする (dev-report.py の先頭を参照)。
#
# 必要な secret (リポジトリの Settings > Secrets and variables > Actions):
#   DISCORD_WEBHOOK_URL             投稿先。ci.yml の通知と同じもの
#   DISCORD_DEV_REPORT_WEBHOOK_URL  (任意) レポートだけ別チャンネルにするとき
#   GEMINI_API_KEY                  (任意) Gemini API のキー。無料枠で動く
#   ANTHROPIC_API_KEY               (任意) Claude API のキー。有料。登録したときだけ使う
# 任意の variable (同じ画面の Variables タブ):
#   NOX_REVIEW_GEMINI_MODEL / NOX_REVIEW_CLAUDE_MODEL / NOX_REVIEW_CLAUDE_EFFORT /
#   NOX_REPORT_MAX_DIFF_CHARS  (既定値は dev-report.py の先頭を参照)
# ============================================================

name: Dev report

on:
  schedule:
    - cron: '7 16 * * *'    # 日次: 毎日 UTC 16:07 = JST 01:07
    - cron: '17 16 * * 0'   # 週次: 日曜 UTC 16:17 = JST 月曜 01:17
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily か weekly'
        type: choice
        options: [daily, weekly]
        default: daily
      dry_run:
        description: '投稿せずに内容だけ確認する'
        type: boolean
        default: true
  push:
    branches: ['**']
    paths:
      - '.github/workflows/dev-report.yml'
      - '.github/scripts/dev-report.py'
      - '.github/scripts/discord_webhook.py'

# 投稿して状態を進める実行だけを、日次と週次それぞれで順番に走らせる (状態を二重に
# 進めないため)。schedule と手動実行で同じグループになるよう、cron の文字列ではなく
# 種類で分ける。dry-run (push と、既定の手動実行) は状態に触らないので実行ごとに別の
# グループにする。同じグループに入れると、待機中の定期実行が後から来た dry-run に
# 置き換えられて消える (cancel-in-progress: false でも待機中の実行は 1 本しか残らない)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && format('dry-{0}', github.run_id) || ((github.event.schedule == '17 16 * * 0' || inputs.mode == 'weekly') && 'weekly' || 'daily') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Report
    runs-on: ubuntu-latest
    # AI の呼び出しは 1 プロバイダ 10 分までに抑えてある (dev-report.py の PROVIDER_BUDGET)。
    # 2 つ使っても収まるよう余裕を持たせる。
    timeout-minutes: 30
    env:
      # 有料の Claude は、スクリプトを変えた push の dry-run では呼ばない
      HAS_ANTHROPIC: ${{ github.event_name != 'push' && secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 前回の地点から今までの履歴と差分を手元の git で取るため

      - name: Resolve mode
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$EVENT" in
            schedule)
              if [ "$SCHEDULE" = '17 16 * * 0' ]; then mode=weekly; else mode=daily; fi
              dry=false ;;
            workflow_dispatch)
              mode="$INPUT_MODE"; dry="$INPUT_DRY_RUN" ;;
            *)
              mode=daily; dry=true ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "mode=$mode dry_run=$dry"

      # 「前回レポートした地点」を取り出す。キーに run_id を含めて毎回新しく保存し、
      # restore-keys の前方一致で最新のものを拾う。master で保存したキャッシュは
      # 他のブランチからも読めるので、dry-run でも同じ範囲になる。
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: .dev-report-state
          key: dev-report-state-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          restore-keys: dev-report-state-${{ steps.mode.outputs.mode }}-

      # Ubuntu のシステム Python には pip で直接入れられない (PEP 668) ので venv を作る。
      # Claude を使うときだけ SDK を入れる。PyPI の障害などで入らなくても止めない
      # (Claude のレビューが失敗として投稿に載るだけで、Gemini とコミット一覧は届く)。
      - name: Set up Python
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          if [ "$HAS_ANTHROPIC" = 'true' ]; then
            "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check 'anthropic>=1,<2' \
              || echo "::warning::anthropic パッケージを入れられなかった。Claude のレビューは失敗になる"
          fi

      # ステップ単位の上限。ジョブの上限に達するとジョブごと中断され、下の失敗通知も
      # 走らない。ステップで先に打ち切れば「失敗」になり、通知が届く。
      - name: Report
        id: report
        timeout-minutes: 25
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_REPORT_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ github.event_name != 'push' && secrets.ANTHROPIC_API_KEY || '' }}
          NOX_REVIEW_GEMINI_MODEL: ${{ vars.NOX_REVIEW_GEMINI_MODEL }}
          NOX_REVIEW_CLAUDE_MODEL: ${{ vars.NOX_REVIEW_CLAUDE_MODEL }}
          NOX_REVIEW_CLAUDE_EFFORT: ${{ vars.NOX_REVIEW_CLAUDE_EFFORT }}
          NOX_REPORT_MAX_DIFF_CHARS: ${{ vars.NOX_REPORT_MAX_DIFF_CHARS }}
          MODE: ${{ steps.mode.outputs.mode }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          args=(--mode "$MODE" --state ".dev-report-state/$MODE.json")
          if [ "$DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/dev-report.py "${args[@]}"

      # 投稿できて地点を進めたときだけ保存する。
      - name: Save state
        if: steps.report.outputs.state_updated == 'true'
        uses: actions/cache/save@v6
        with:
          path: .dev-report-state
          key: dev-report-state-${{ steps.mode.outputs.mode }}-${{ github.run_id }}

      # 以前の別リポジトリ版は、毎日失敗していたのに誰も気付かなかった。
      # 定期実行が落ちたら (投稿の失敗・タイムアウト・想定外のエラー) Discord に流す。
      - name: Notify failure
        if: failure() && steps.mode.outputs.dry_run != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_REPORT_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python3 .github/scripts/discord_webhook.py \
            --title ":x: 開発レポートの作成に失敗した — ${GITHUB_REPOSITORY}" \
            --description "ログを確認すること。地点は進めていないので、次回に同じ範囲をもう一度扱う。" \
            --color red --url "$RUN_URL" \
            --footer "${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
