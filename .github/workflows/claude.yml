# ============================================================
# Claude (PR / Issue で /claude と書いたときだけ動く)
#
# 目的  : PR のコメントやレビューで「/claude review」などと書くと、Claude が
#         差分をレビューしたり質問に答えたりする。Copilot のレビュー枠が
#         尽きたときや、大きな変更を念入りに見てほしいときに使う。
#         レビューの基準は CLAUDE.md (→ AGENTS.md) の規約。
# 使い方: コメントの先頭に「/claude」と書き、空白か改行を挟んで頼む。
#         例:「/claude review」「/claude この変更で性能は落ちない?」
#         「/claudeレビューして」のように続けて書くと反応しない。
# モデル: 「/claude fable レビューして」のように /claude の直後にモデル名を書くと
#         そのモデルで動く (fable / opus / sonnet / haiku、省くと opus)。
#         名前に近い打ち間違い (fabel など) は Claude を起動せず「もしかして」を返す。
#         対応表と判定は .github/scripts/claude-model.py。
# @claude にしない理由: GitHub の実在のユーザー `claude` へのメンションになり、
#         Anthropic の Claude GitHub App も反応して 👀 を付ける (Code Review が
#         「@claude review」をコマンドとして使う)。GitHub の Agent HQ の Claude
#         (こちらは @claude[agent] で呼ぶ) とも紛らわしい。
# 自動では走らせない: Nox の PR は大半が Claude のセッションで作られて検証済みで、
#         Copilot の自動レビューと日次の Dev report もある。PR ごとに自動で
#         走らせると重複が多く、利用枠も減る。
# 認証  : CLAUDE_CODE_OAUTH_TOKEN (手元の Claude Code CLI で `claude setup-token`)。
#         Claude のサブスクリプションの利用枠を使い、API の従量課金はかからない。
#         Claude Code を普段使う枠と同じなので、使った分だけ普段の枠が減る。
# 権限  : 公開リポジトリなので誰でもコメントできる。他人の /claude で枠を
#         使われないよう、オーナー・メンバー・共同編集者のコメントだけに反応する。
#         用途はレビューと回答。ただし下の permissions が効くのは GITHUB_TOKEN
#         だけで、Claude は Claude GitHub App のトークン (contents / pull-requests /
#         issues が write) で動く。頼めば新しいブランチへ push はできる。
#         PR は作らない (作成ページへのリンクを返すだけ)。
# 詳細  : https://code.claude.com/docs/en/github-actions
# ============================================================

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    # 先頭が /claude のコメントだけで走らせる。contains にすると
    # 「https://claude.ai/...」のような URL にも当たり、ランナーが無駄に立ち上がる。
    if: >-
      (
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && startsWith(github.event.review.body, '/claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    # 暴走して利用枠を使い切らないための上限
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write   # レビューコメントを書く
      issues: write          # 会話欄に返信する
      id-token: write        # Claude GitHub App の認証に使う
      actions: read          # CI の結果を読んで答えられるように

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # コメント本文は式で run: に埋め込まず、環境変数で渡す (任意のコマンドを
      # 差し込まれないため)。スクリプトが返すのは許可リストにあるモデル ID だけ
      - name: Choose model
        id: model
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body }}
        run: python3 .github/scripts/claude-model.py

      - name: Suggest model name
        if: steps.model.outputs.suggestion != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          SUGGESTION: ${{ steps.model.outputs.suggestion }}
        run: gh issue comment "$NUMBER" --body "$SUGGESTION"

      - uses: anthropics/claude-code-action@v1
        if: steps.model.outputs.suggestion == ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 既定の @claude から変える (理由は冒頭)
          trigger_phrase: "/claude"
          claude_args: --model ${{ steps.model.outputs.model }}
          # job の actions: read だけでは Claude 側のトークンに渡らないので、
          # ここでも渡して CI の結果を読めるようにする (claude-code-action の FAQ)
          additional_permissions: |
            actions: read
