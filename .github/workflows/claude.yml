# ============================================================
# Claude (PR / Issue で @claude と書いたときだけ動く)
#
# 目的  : PR のコメントやレビューで「@claude review」などと書くと、Claude が
#         差分をレビューしたり質問に答えたりする。Copilot のレビュー枠が
#         尽きたときや、大きな変更を念入りに見てほしいときに使う。
#         レビューの基準は CLAUDE.md (→ AGENTS.md) の規約。
# 使い方: PR の会話欄に「@claude review」「@claude この変更で性能は落ちない?」など。
# 自動では走らせない: Nox の PR は大半が Claude のセッションで作られて検証済みで、
#         Copilot の自動レビューと日次の Dev report もある。PR ごとに自動で
#         走らせると重複が多く、利用枠も減る。
# 認証  : CLAUDE_CODE_OAUTH_TOKEN (手元の Claude Code CLI で `claude setup-token`)。
#         Claude のサブスクリプションの利用枠を使い、API の従量課金はかからない。
#         Claude Code を普段使う枠と同じなので、使った分だけ普段の枠が減る。
# 権限  : 公開リポジトリなので誰でもコメントできる。他人の @claude で枠を
#         使われないよう、オーナー・メンバー・共同編集者のコメントだけに反応する。
#         コードは書き換えさせない (contents: read)。レビューと回答だけ。
# 詳細  : https://code.claude.com/docs/en/github-actions
# ============================================================

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    # 暴走して利用枠を使い切らないための上限
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write   # レビューコメントを書く
      issues: write          # 会話欄に返信する
      id-token: write        # Claude GitHub App の認証に使う
      actions: read          # CI の結果を読んで答えられるように

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
