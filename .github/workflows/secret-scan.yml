# 秘密情報スキャンを ci.yml から切り出した専用ワークフロー。
#
# 分けている理由は ci.yml の paths-ignore にある。あちらは Markdown や
# docs/ だけの変更で windows ランナーを起こさないよう除外しているが、
# その除外はワークフロー単位で効く。同居させると「ドキュメントに
# API キーを貼った push」がまるごと検査されずに通ってしまう。
# ここには paths-ignore を置かず、全ての push を無条件で検査する。
#
# なお、これは push が完了した後に走るので流出そのものは防げない。
# 防ぐのは手元の tools/git-hooks (pre-push) と、GitHub の
# push protection (Settings > Code security) の役目。
# このワークフローは、その 2 つをすり抜けた場合に気付くための層。

name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# concurrency は付けない。このワークフローは push ごとの差分 (before..sha) を
# 検査するので、1 本でも実行が消えるとその push の範囲が検査されないまま残る。
# cancel-in-progress: false にしても、待機中の実行は新しい実行に置き換えられて
# 消える (グループに待機できるのは 1 本だけ)。各実行は読むだけで互いに干渉しない
# ので、並行して走らせて全部完走させる。

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 履歴を遡って差分を取るため

      # 1. このリポジトリ固有の検査。
      #    成果物の混入・ローカル絶対パス・個人メールなど、汎用の
      #    秘密情報スキャナが対象にしない種類を見る。
      - name: Repo-specific scan
        shell: bash
        run: |
          set -uo pipefail
          before='${{ github.event.before }}'
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before" 2>/dev/null; then
            files=$(git diff --name-only "$before" "${{ github.sha }}")
            echo "差分 $before..${{ github.sha }} を検査する"
          else
            files=$(git ls-tree -r --name-only HEAD)
            echo "全ツリーを検査する (初回 push か、遡れない push)"
          fi
          if [ -z "$files" ]; then echo "対象ファイルなし"; exit 0; fi
          echo "$files" | wc -l | xargs echo "検査対象:"
          TAB=$(printf '\t')
          echo "$files" | while IFS= read -r f; do
            if [ -n "$f" ] && git cat-file -e "HEAD:$f" 2>/dev/null; then
              echo "${f}${TAB}HEAD:${f}"
            fi
          done | sh tools/git-hooks/scan.sh

      # 1b. 外部資料の名前 (ファイルの中身とコミットメッセージ)。
      #     メッセージは直すと履歴の書き換えになるので、手元の commit-msg /
      #     pre-push フックで止めるのが本筋。ここはすり抜けに気付くための層。
      #
      #     検査器は検査対象のコミットから取らず、信頼できる側の版に固定する。
      #     検査対象の側で検査器を無効化したり禁止リストを削ったりしても素通りさせないため。
      #       pull_request          … PR の base
      #       既定ブランチへの push … push 前の先端 (before)
      #       それ以外の push       … 既定ブランチの先端
      #     禁止リストは信頼側と検査対象の和集合にする (検査対象で足した名前は効かせる)。
      #     信頼側にまだ検査器が無いとき (導入するコミット自身) だけは検査対象の版を使う。
      #     なお pull_request ではこのワークフロー自体も PR 側の版で動く。そこを塞ぐのは
      #     .github の変更に対するレビューの役目。
      #     1. の scan.sh も手元と同じく中身を見るが、そちらは検査対象の版で動く。
      - name: External names
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          zero=0000000000000000000000000000000000000000
          has_before=false
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            has_before=true
          fi

          if [ "$EVENT" = "pull_request" ]; then
            trusted="$PR_BASE"
          elif [ "$has_before" = true ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            trusted="$BEFORE"
          else
            trusted="origin/$DEFAULT_BRANCH"
          fi
          dir="$RUNNER_TEMP/external-names"
          mkdir -p "$dir"
          checker=tools/git-hooks/check-external-names.py
          list=tools/git-hooks/external-names.sha256
          if git show "$trusted:$checker" > "$dir/check.py" 2>/dev/null && git show "$trusted:$list" > "$dir/trusted.sha256" 2>/dev/null; then
            echo "検査器は $trusted の版を使う"
          else
            echo "::warning::$trusted に検査器が無いので、検査対象の版を使う"
            cp "$checker" "$dir/check.py"
            : > "$dir/trusted.sha256"
          fi
          lists=(--list "$dir/trusted.sha256")
          [ -f "$list" ] && lists+=(--list "$list")

          # ファイルの中身
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$PR_BASE" HEAD)
          elif [ "$has_before" = true ]; then
            files=$(git diff --name-only "$BEFORE" "$SHA")
          else
            files=$(git ls-tree -r --name-only HEAD)
          fi
          status=0
          TAB=$(printf '\t')
          echo "$files" | while IFS= read -r f; do
            if [ -n "$f" ] && git cat-file -e "HEAD:$f" 2>/dev/null; then
              echo "${f}${TAB}HEAD:${f}"
            fi
          done | python3 "$dir/check.py" "${lists[@]}" --blobs || status=1

          # コミットメッセージ (--commits は残りの引数を全部取るので最後に置く)
          if [ "$EVENT" = "pull_request" ]; then
            revs=("$PR_BASE..$PR_HEAD")
          elif [ "$has_before" = true ]; then
            revs=("$BEFORE..$SHA")
          else
            # 新規ブランチなど。既定ブランチに無いコミットだけを見る。
            revs=("$SHA" --not "origin/$DEFAULT_BRANCH")
          fi
          echo "コミットメッセージの検査範囲: ${revs[*]}"
          python3 "$dir/check.py" "${lists[@]}" --commits "${revs[@]}" || status=1
          exit "$status"

      # 2. 汎用スキャナ。手元のフックと Claude Code on the web のセッション
      #    (.claude/hooks/session-start.sh がフックを入れる) でも同じものを呼んでいるが、
      #    フックを入れていない環境や --no-verify で飛ばした push はここが最後の網になる。
      #
      #    公式の gitleaks-action は使っていない。組織アカウントでは
      #    ライセンスキーを要求する仕様で、かつ可変タグ参照になるため。
      #    バージョンを固定してバイナリを取得し、チェックサムを検証する。
      #
      #    版を上げるときは .claude/hooks/session-start.sh の GITLEAKS_VERSION と
      #    GITLEAKS_SHA256_* も揃える。食い違っているとこのステップが落ちる
      #    (揃え忘れると、クラウドのセッションで gitleaks の検証が毎回失敗し、
      #    組み込みパターンだけの検査へ黙って落ちるため)。
      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd /tmp
          curl -fsSL "$base/$archive" -o "$archive"
          # リリースに付属する checksums.txt と突き合わせる (ファイル名を揃えて同じディレクトリで検証する)
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o sums.txt
          grep " $archive$" sums.txt | sha256sum -c -

          hook="$GITHUB_WORKSPACE/.claude/hooks/session-start.sh"
          if [ -f "$hook" ]; then
            bad=0
            grep -qx "GITLEAKS_VERSION=${GITLEAKS_VERSION}" "$hook" || bad=1
            for arch in x64 arm64; do
              want=$(grep " gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz$" sums.txt | cut -d' ' -f1)
              key="GITLEAKS_SHA256_LINUX_$(printf '%s' "$arch" | tr '[:lower:]' '[:upper:]')"
              grep -qx "${key}=${want}" "$hook" || bad=1
            done
            if [ "$bad" -ne 0 ]; then
              echo "::error file=.claude/hooks/session-start.sh::gitleaks の版か SHA256 が secret-scan.yml (v${GITLEAKS_VERSION}) の checksums.txt と食い違っている"
              exit 1
            fi
          fi

          tar -xzf "$archive" gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        shell: bash
        run: gitleaks git . --no-banner --redact --exit-code 1
