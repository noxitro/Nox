# 秘密情報スキャンを ci.yml から切り出した専用ワークフロー。
#
# 分けている理由は ci.yml の paths-ignore にある。あちらは Markdown や
# docs/ だけの変更で windows ランナーを起こさないよう除外しているが、
# その除外はワークフロー単位で効く。同居させると「ドキュメントに
# API キーを貼った push」がまるごと検査されずに通ってしまう。
# ここには paths-ignore を置かず、全ての push を無条件で検査する。
#
# なお、これは push が完了した後に走るので流出そのものは防げない。
# 防ぐのは手元の tools/git-hooks (pre-push) と、GitHub の
# push protection (Settings > Code security) の役目。
# このワークフローは、その 2 つをすり抜けた場合に気付くための層。

name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# concurrency は付けない。このワークフローは push ごとの差分 (before..sha) を
# 検査するので、1 本でも実行が消えるとその push の範囲が検査されないまま残る。
# cancel-in-progress: false にしても、待機中の実行は新しい実行に置き換えられて
# 消える (グループに待機できるのは 1 本だけ)。各実行は読むだけで互いに干渉しない
# ので、並行して走らせて全部完走させる。

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 履歴を遡って差分を取るため

      # 1. このリポジトリ固有の検査。
      #    成果物の混入・ローカル絶対パス・個人メールなど、汎用の
      #    秘密情報スキャナが対象にしない種類を見る。
      - name: Repo-specific scan
        shell: bash
        run: |
          set -uo pipefail
          before='${{ github.event.before }}'
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before" 2>/dev/null; then
            files=$(git diff --name-only "$before" "${{ github.sha }}")
            echo "差分 $before..${{ github.sha }} を検査する"
          else
            files=$(git ls-tree -r --name-only HEAD)
            echo "全ツリーを検査する (初回 push か、遡れない push)"
          fi
          if [ -z "$files" ]; then echo "対象ファイルなし"; exit 0; fi
          echo "$files" | wc -l | xargs echo "検査対象:"
          TAB=$(printf '\t')
          echo "$files" | while IFS= read -r f; do
            if [ -n "$f" ] && git cat-file -e "HEAD:$f" 2>/dev/null; then
              echo "${f}${TAB}HEAD:${f}"
            fi
          done | sh tools/git-hooks/scan.sh

      # 2. 汎用スキャナ。手元のフックでも同じものを呼んでいるが、
      #    クラウド側から直接 push してくる
      #    経路はフックを通らないので、ここが最後の網になる。
      #
      #    公式の gitleaks-action は使っていない。組織アカウントでは
      #    ライセンスキーを要求する仕様で、かつ可変タグ参照になるため。
      #    バージョンを固定してバイナリを取得し、チェックサムを検証する。
      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd /tmp
          curl -fsSL "$base/$archive" -o "$archive"
          # リリースに付属する checksums.txt と突き合わせる (ファイル名を揃えて同じディレクトリで検証する)
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o sums.txt
          grep " $archive$" sums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        shell: bash
        run: gitleaks git . --no-banner --redact --exit-code 1
