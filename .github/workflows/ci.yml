# ============================================================
# CI (Runtime)
#
# 目的  : push ごとに runtime をビルドし、GoogleTest スイートを実際に
#         走らせて回帰を検知する。
# 構成  : Build & test (MSVC / ClangCL x Debug / Release / Master の 6 並列) と
#         Editor ジョブを並列実行。GoogleTest と FlaUI は独立したジョブではなく、
#         マトリクスジョブの中で走る。同じ構成を 2 回建てないため。
#         GoogleTest は Master 以外の 4 ジョブ、FlaUI は MSVC の Debug / Release。
#         FlaUI には Editor と runtime.exe の接続テスト (Reboot → attach) も含む。
#         runtime.exe の起動・終了 (スモーク) は 6 ジョブすべてで走る。
#         Master だけテストを飛ばしているのは、reflection_generated の pch.h /
#         reflect.cpp が runtime/core/test/test_types.h のテスト型を
#         #if !NOX_MASTER で囲っており、Master ではテスト型のリフレクションが
#         生成されず core_test が成立しないため。
#         前準備は .github/actions/setup-nox-build に切り出してある。
#         MSVC の 3 ジョブは Build runtime.slnx を C++ Build Insights で計測し、
#         build-insights ジョブが重いヘッダ・テンプレート・関数のレポートにする
#         (tools/build-insights/README.md)。
# 環境  : windows。runtime は PlatformToolset=v145 (runtime/Directory.Build.props)
#         (Visual Studio 2026) を要求するため windows-2022 では動かない。
# 費用  : 公開リポジトリなので GitHub ホストランナーは無料 (実行の usage で
#         billable が 0 ms になっているのを確認済み)。private に戻すと
#         windows-latest は無料枠を 2 倍で消費し、6 並列 + Test + Editor で
#         1 push あたり約 160 請求分かかる (public 化前の実測)。その場合は
#         セルフホストランナーを登録してリポジトリ変数 NOX_RUNNER=self-hosted
#         を設定する (セルフホストの実行時間は無料枠を消費しない)。
# ============================================================

name: CI

on:
  # 作業ブランチへ直接 push する運用なので、ブランチは絞らず全部を対象にする。
  # タグ push での二重起動だけは避けたいので branches で限定してある。
  push:
    branches: ['**']
    # 文書だけの変更で windows ランナーを起こさない
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      # ベンチマークの結果ページだけの変更は bench-publish.yml が計測なしで作り直す
      - 'tools/bench-site/**'
  # pull_request は外してある。同一リポジトリのブランチへの PR は push 側と
  # 合わせて毎回 2 倍走り、ref が違うので concurrency でも畳めないため。
  # 公開後もフォーク PR は受けていない。受けるなら pull_request を戻し、
  # secrets を触る notify ジョブがフォークで動かないことを確認すること。
  #
  # Dependabot のうち Editor の NuGet 更新 (dependabot/nuget/**) では runtime の
  # 6 構成ビルドだけ飛ばす。C# の依存が C++ ランタイムに影響しないため。
  # actions の更新は CI 自身を書き換えるので何も飛ばさない (各ジョブの if を参照)。
  workflow_dispatch:   # GitHub UI の「Run workflow」から手動実行

# 同じ ref に新しい push が来たら、走っている古い実行を打ち切る。
# ただし master は打ち切らない。master へ連続 push すると完了した結果が
# 虫食いになり (実際に run #49〜#51 が cancelled で終わっている)、
# 「master の最新は緑か」も notify の復旧判定も答えられなくなるため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# GITHUB_TOKEN は既定で読み取りに絞る。書き込みが要るジョブ (notify の
# actions: read など) はジョブ側で個別に広げる。
permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  # =========================================================
  # Build & test: runtime.slnx を 2 コンパイラ x 3 構成で建て、
  #               そのジョブの中で GoogleTest と FlaUI まで走らせる
  #
  # かつては Build ジョブ (6 構成) と Test ジョブ (Debug) が別々だった。
  # そのせいで Debug のフルビルドが 1 push につき 2 回走り、Test ジョブが
  # 10〜13 分でクリティカルパスになっていた。テストを Debug と Release の
  # 両方で回したくなると、この重複は構成の数だけ増える。
  #
  # マトリクスジョブは「その構成のライブラリを建て終わった状態」なので、
  # テストのビルドと実行をそこへ足せば重複は構造的に消える。実測で
  # テストのビルドは約 30 秒、実行は数秒なので、各ジョブへの上乗せは僅か。
  # 副作用として、これまで MSVC/Debug でしか走っていなかった GoogleTest が
  # ClangCL と Release でも走るようになる (最適化や /GL で初めて出る不具合は
  # Debug では原理的に拾えない)。FlaUI も MSVC の Debug / Release で走る。
  #
  # Master でテストを走らせないのは、reflection_generated の pch.h /
  # reflect.cpp が test_support のテスト型を #if !NOX_MASTER で囲っており、
  # テスト型のリフレクションが生成されないため。ビルド自体は通るが
  # 成立しない。
  # =========================================================
  build:
    name: Build & test (${{ matrix.compiler }} / ${{ matrix.configuration }})
    # 既定は GitHub ホストの windows-latest。リポジトリ変数 NOX_RUNNER を
    # 設定するとそちらへ回す (例: NOX_RUNNER=self-hosted)。セルフホストの
    # 実行時間は無料枠を消費しないので、6 構成を毎 push で建てるならこれ。
    # 手元は VS2026 (v145) が入っている前提。
    runs-on: ${{ vars.NOX_RUNNER || 'windows-latest' }}
    # ビルド + テスト + Editor + FlaUI まで 1 ジョブで通すので、
    # 分かれていたころ (30) より余裕を持たせる。実測は MSVC/Debug で約 10 分。
    timeout-minutes: 40
    # ベンチマークの比較元 (master で建てた bench_test.exe) をアーティファクトから
    # 取るので actions: read を足す。書き込みは増やさない。
    permissions:
      contents: read
      actions: read

    strategy:
      fail-fast: false   # 片方が転んでももう片方は最後まで走らせる
      matrix:
        # compiler x configuration の直積 (6 ジョブ)。このリポジトリは
        # 重要なので、push のたびに 6 構成すべてを建てる。
        #
        # 費用はファイル冒頭の「費用」を参照 (公開リポジトリなので今は無料)。
        #
        # --- 各構成を建てている理由 ---
        # Release: Debug しか建てていなかったせいで NOX_INFO_LINE /
        #   NOX_ERROR_LINE の無効化側が 2 引数固定のまま壊れていた (C4002)
        #   のに気付けなかった。#if NOX_DEBUG の外側は Debug では
        #   一切コンパイルされない。
        # Master: 出荷構成なのに一度も建てておらず、dev 機能
        #   (editor_remote / remote log / socket stream) のヘッダが
        #   #if NOX_DEVELOP で消えるのに .cpp が無防備なまま残り、
        #   core.vcxproj だけで 193 件のエラーになっていた。
        # ClangCL: MSVC が見逃す非適合を実際に拾う。生成コードの
        #   setter/getter が非ジェネリックラムダ本体に if constexpr を
        #   直書きしてガードが実質機能していなかった件など。
        #   落ちたときは原因を直すこと。無効化で回避しないこと。
        #   解消済みの壁: c342965 / 6552cb3 / 137397f / 008d27e
        #   (2026-09 の履歴書き換えで SHA が変わっている)
        #
        # --- dependabot/nuget のときだけ縮める ---
        # Editor の NuGet 更新は C++ ランタイムに影響しないので、C++ 専用の
        # 構成 (ClangCL / Release / Master) は建てない。ただし丸ごと飛ばすと
        # FlaUI も一緒に消える。AvalonDock のような UI ライブラリの更新が
        # 実際に起動して動くかを確かめられるのはそこだけなので、
        # MSVC/Debug の 1 ジョブだけは残す。
        # actions の更新は setup-nox-build を通るので何も飛ばさない。
        #
        # ジョブ側の if: では matrix コンテキストを読めないので、matrix 自体を
        # 式で切り替える。include: は使わない (既存の組み合わせにマージ
        # できない include エントリは「新しいジョブを増やす」ため、
        # compiler を絞ったつもりで ClangCL が復活する)。
        compiler: ${{ fromJSON(startsWith(github.ref, 'refs/heads/dependabot/nuget/') && '["MSVC"]' || '["MSVC","ClangCL"]') }}
        configuration: ${{ fromJSON(startsWith(github.ref, 'refs/heads/dependabot/nuget/') && '["Debug"]' || '["Debug","Release","Master"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build prerequisites
        uses: ./.github/actions/setup-nox-build

      # ---------------------------------------------------------
      # Build Insights (C++ のビルド時間の内訳) の計測
      #
      # 下の Build runtime.slnx を計測で挟み、重いヘッダ・テンプレート・関数を集計する。
      # ビルドを増やさずに済むよう、既存のフルビルドをそのまま計る。MSVC だけ
      # (Build Insights は MSVC のイベントを使う)。レポートは build-insights ジョブが作る。
      #
      # 計測はビルドの合否に影響させない。失敗したら ::warning:: を出して ok=false を返し、
      # 後続の停止・集計・アップロードを飛ばすだけ (continue-on-error は使わない)。
      # ETW を使うので管理者権限が要る。GitHub ホストのランナーは管理者で動くが、
      # 管理者でないセルフホストでは開始に失敗し、計測なしでビルドだけが走る。
      #
      # テンプレートの展開は Debug だけで記録する。3 構成とも記録した初回の実測で、
      # ビルドのステップが 30〜45% 延びた (Debug 5:19→7:05、Release 5:26→7:12、
      # Master 3:43→5:26。ETL は Debug で 612 MB、イベントの欠落は 0)。
      # 延びた分のほとんどはテンプレートのイベントで、フロントエンドの仕事
      # (どのテンプレートを展開するか) は構成でほぼ変わらないので 1 構成で足りる。
      # 計測ツールは tools/build-insights (SDK の版は build.ps1 で固定)。
      # ---------------------------------------------------------
      - name: Cache Build Insights tool
        if: matrix.compiler == 'MSVC'
        uses: actions/cache@v6
        with:
          path: tools/build-insights/out
          key: build-insights-tool-${{ runner.os }}-${{ hashFiles('tools/build-insights/nox_build_insights.cpp', 'tools/build-insights/build.ps1') }}

      - name: Start Build Insights
        id: bi-start
        if: matrix.compiler == 'MSVC'
        env:
          CONFIG: ${{ matrix.configuration }}
        run: |
          $ok = $false
          try {
            $exe = 'tools\build-insights\out\nox_build_insights.exe'
            if (-not (Test-Path $exe)) { & tools\build-insights\build.ps1 }
            $biArgs = @('start', 'NoxCI')
            if ($env:CONFIG -ne 'Debug') { $biArgs += '--no-templates' }
            & $exe @biArgs
            if ($LASTEXITCODE -eq 0) { $ok = $true }
            else { Write-Host "::warning::Build Insights の計測を開始できなかった (exit $LASTEXITCODE)。計測なしでビルドする" }
          } catch {
            Write-Host "::warning::Build Insights の準備に失敗した: $_ 。計測なしでビルドする"
          }
          "ok=$($ok.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "started=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # 計測の失敗でステップを落とさない (pwsh は最後の $LASTEXITCODE をステップの結果にする)
          exit 0

      # runtime.sln ではなく runtime.slnx。VS2026 / MSBuild 18 の
      # 新しいソリューション形式で、リポジトリに .sln は存在しない
      - name: Build runtime.slnx
        id: build
        run: |
          msbuild runtime\runtime.slnx `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:PlatformToolset=${{ matrix.compiler == 'MSVC' && 'v145' || 'ClangCL' }} `
            /m `
            /v:minimal `
            /nologo `
            "/flp:logfile=build.log;verbosity=normal"

      # ビルドが落ちても、そこまでの計測は集計する (どこで時間を使っていたかは失敗時も役に立つ)。
      # テストのビルドを計測に混ぜないよう、ビルドの直後に止める。
      # 生の ETL は大きい (Debug で 600 MB 前後) ので RUNNER_TEMP に置き、手動実行
      # (workflow_dispatch) のときだけ上げる (手元で WPA に読ませて深掘りする用)。
      # 毎回上げるとジョブが数分延びるので、それ以外は集計したら消す。
      - name: Stop Build Insights and analyze
        id: bi-stop
        if: always() && steps.bi-start.outputs.ok == 'true'
        env:
          CONFIG: ${{ matrix.configuration }}
          STARTED: ${{ steps.bi-start.outputs.started }}
          KEEP_RAW: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          $exe = 'tools\build-insights\out\nox_build_insights.exe'
          $buildSeconds = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:STARTED
          $dir = Join-Path $env:RUNNER_TEMP 'build-insights'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $raw = Join-Path $dir "raw-$env:CONFIG.etl"
          New-Item -ItemType Directory -Force -Path bi-out | Out-Null
          $ok = $false
          & $exe stop NoxCI $raw
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $raw)) {
            Write-Host "::warning::Build Insights の計測を止められなかった (exit $LASTEXITCODE)"
          } else {
            $etlMb = [math]::Round((Get-Item $raw).Length / 1MB, 1)
            $sw = [Diagnostics.Stopwatch]::StartNew()
            & $exe analyze $raw "bi-out\bi-$env:CONFIG.json"
            $analyzeSeconds = [math]::Round($sw.Elapsed.TotalSeconds, 1)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::Build Insights の集計に失敗した (exit $LASTEXITCODE)"
            } else {
              $ok = $true
              Write-Host "ETL $etlMb MB / 集計 $analyzeSeconds 秒 / ビルド $buildSeconds 秒"
              [ordered]@{
                config          = $env:CONFIG
                compiler        = 'MSVC'
                sha             = $env:GITHUB_SHA
                ref             = $env:GITHUB_REF_NAME
                subject         = (git log -1 --format=%s)
                workspace       = $env:GITHUB_WORKSPACE
                templates       = ($env:CONFIG -eq 'Debug')
                build_seconds   = $buildSeconds
                etl_mb          = $etlMb
                analyze_seconds = $analyzeSeconds
              } | ConvertTo-Json | Set-Content -Path "bi-out\bi-$env:CONFIG.meta.json" -Encoding utf8NoBOM
            }
          }
          if ($env:KEEP_RAW -eq 'true' -and (Test-Path $raw)) {
            "raw=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Remove-Item -Force -ErrorAction SilentlyContinue $raw
          }
          Remove-Item -Force -ErrorAction SilentlyContinue "$raw.stats.json"
          "ok=$($ok.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Upload Build Insights data
        if: always() && steps.bi-stop.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-insights-MSVC-${{ matrix.configuration }}
          path: bi-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Build Insights raw trace
        if: always() && steps.bi-stop.outputs.raw != ''
        uses: actions/upload-artifact@v7
        with:
          name: build-insights-etl-${{ matrix.configuration }}
          path: ${{ steps.bi-stop.outputs.raw }}
          retention-days: 7
          if-no-files-found: warn

      # ---------------------------------------------------------
      # runtime.exe の起動・終了 (スモーク)
      #
      # AGENTS.md の「master へ入れる条件」にある「runtime.exe がクラッシュせず
      # 起動・終了する」を確かめる。FlaUI の Reboot テストも runtime.exe を起こすが、
      # 最後は強制終了するので、正常終了の経路 (Terminate フェーズ、World の後始末、
      # reflection / memory の終了処理) は通らない。しかも FlaUI は MSVC の
      # Debug / Release でしか走らないので、Master と ClangCL の runtime.exe は
      # これまで一度も起動されていなかった。
      #
      # --exit-after-frames=N を渡すと、N フレーム目にメインウィンドウを閉じ、
      # 閉じるボタンを押したときと同じ経路 (WM_CLOSE → WM_DESTROY → WM_QUIT) で
      # 終了する (nox::ResolveExitAfterFrames)。制限時間内に終了コード 0 で
      # 終わることを見る。Init / Start / Update の各フェーズを一通り通れば足りるので、
      # フレーム数は少なくしてある。
      #
      # runtime.exe は Windows サブシステムで標準出力を持たないので、異常終了したときは
      # 同じ引数でデバッガ (WDK に付いてくる cdb) の下で起動し直し、例外で止まった地点の
      # スタックを出す。PDB は exe の隣に出ているので、関数名と行番号まで読める。
      # デバッガが無いイメージや、終わらなかった (ハング) ときは、Windows のイベントログ
      # (Application Error / WER) に残った記録を拾って出す。
      # 作業ディレクトリは Editor (Core.RuntimeSession) と同じく exe の置き場所。
      #
      # テストのビルドより前に置いているのは、テストを建てない Master でも走らせるため。
      # ---------------------------------------------------------
      - name: Run runtime.exe (start / exit)
        run: |
          $exe = (Resolve-Path 'runtime\build\runtime\x64\${{ matrix.configuration }}\runtime.exe').Path
          $frames = 30
          $limitSeconds = 120
          $started = Get-Date

          $psi = [System.Diagnostics.ProcessStartInfo]::new($exe, "--exit-after-frames=$frames")
          $psi.UseShellExecute = $false
          $psi.WorkingDirectory = Split-Path $exe
          $process = [System.Diagnostics.Process]::Start($psi)

          $problem = $null
          $crashed = $false
          if (-not $process.WaitForExit($limitSeconds * 1000)) {
            $process.Kill($true)
            $problem = "$limitSeconds 秒以内に終了しなかった (ハング、または終了要求が届いていない)"
          }
          elseif ($process.ExitCode -ne 0) {
            $crashed = $true
            $problem = 'exit 0x{0:X8} で終了した (クラッシュ、またはアサート)' -f $process.ExitCode
          }
          $elapsed = ((Get-Date) - $started).TotalSeconds

          $icon = if ($problem) { ':x:' } else { ':white_check_mark:' }
          $detail = if ($problem) { $problem } else { '{0} フレーム回して正常終了 ({1:N1} 秒)' -f $frames, $elapsed }
          @('', "## $icon runtime.exe の起動・終了 (${{ matrix.compiler }} / ${{ matrix.configuration }})", '', $detail) |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($problem) {
            $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\cdb.exe'
            if ($crashed -and (Test-Path $cdb)) {
              # g で走らせ、例外で止まったら内容・レジスタ・スタックを出して終わる
              $exeDir = Split-Path $exe
              $arguments = '-lines -y "{0}" -c "g; .lastevent; r; kn 60; q" "{1}" --exit-after-frames={2}' -f $exeDir, $exe, $frames
              $dbgInfo = [System.Diagnostics.ProcessStartInfo]::new($cdb, $arguments)
              $dbgInfo.UseShellExecute = $false
              $dbgInfo.RedirectStandardOutput = $true
              $dbgInfo.WorkingDirectory = $exeDir
              $debugger = [System.Diagnostics.Process]::Start($dbgInfo)
              $output = $debugger.StandardOutput.ReadToEndAsync()
              if (-not $debugger.WaitForExit($limitSeconds * 1000)) { $debugger.Kill($true) }
              Write-Host '=== cdb: 例外で止まった地点 ==='
              Write-Host $output.Result
            }
            else {
              if ($crashed) { Write-Host "cdb が無いのでスタックは取れない: $cdb" }
              $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started } -ErrorAction SilentlyContinue |
                Where-Object { ($_.ProviderName -in @('Application Error', 'Windows Error Reporting')) -and ($_.Message -match 'runtime\.exe') } |
                Select-Object -First 5
              foreach ($e in $events) {
                Write-Host "=== [$($e.TimeCreated)] $($e.ProviderName) (Id $($e.Id))"
                Write-Host $e.Message
              }
            }
            throw "runtime.exe: $problem"
          }
          Write-Host $detail

      # ---------------------------------------------------------
      # GoogleTest
      #
      #   - kernel_test : kernel だけに依存する下層のテスト
      #   - core_test   : core / reflection / reflection_generated に依存する
      #                   テスト (リフレクションの getter/setter は生成コードを
      #                   実際に走らせないと検証できないので、生成器も動く)
      #
      # 両者は runtime.slnx で <Build Project="false" /> が付いていて、
      # 上のソリューションビルドでは建たない。Release では
      # nox_release.props の WholeProgramOptimization で全プロジェクトに /GL が
      # 付き、コード生成がリンク時まで遅れる。このとき link.exe は一時ファイル
      # (*.g.asm) を「.obj の出身プロジェクト」の中間ディレクトリへ書くので、
      # reflection_generated.lib を共有する runtime.exe と core_test.exe を /m で
      # 同時にリンクすると同じパスを取り合って落ちる
      # (C1083 Permission denied -> LNK1257)。msbuild の呼び出しを分ければ
      # 時間的に重ならないので、構成によらずこの衝突は起きない。
      # ---------------------------------------------------------
      - name: Build test projects
        if: matrix.configuration != 'Master'
        run: |
          # vcxproj を直接建てると MSBuild はソリューション由来のプロパティを
          # 設定しない ($(SolutionPath) は *Undefined* という文字列になる)。
          # 3 つとも実際に使われているので、ソリューションビルドと同じ値を渡す。
          #
          #   SolutionDir  : nox_common.props の OutDir / IntDir の起点。
          #                  渡さないと出力先がずれて次のステップが exe を見失う
          #   SolutionName : 同上 (build\<SolutionName>\... に入る)
          #   SolutionPath : reflection_generated/Directory.Build.targets が
          #                  ReflectionGenerator へ -solution として渡す。
          #                  *Undefined* のままだと IOException で落ちる
          #
          # 参照先 (core / kernel / reflection / reflection_generated) は直前の
          # ソリューションビルドで出来ているので建て直さない。プロパティの値が
          # ソリューションビルドと文字列として一致しないと最新判定が外れて
          # 全部作り直しになり、このステップだけで 4 分以上かかっていた。
          # BuildProjectReferences=false でも参照先の出力パスは解決されるので、
          # リンク入力は変わらない。
          #
          # 区切りを / にしてあるのは、SolutionDir の末尾が \ だと引数の
          # 引用符がエスケープ扱いになって壊れるため。Windows は混在を許す。
          $solutionDir  = (Resolve-Path 'runtime').Path.Replace('\', '/') + '/'
          $solutionPath = $solutionDir + 'runtime.slnx'

          $projects = @(
            'runtime\kernel\test\kernel_test.vcxproj',
            'runtime\core\test\core_test.vcxproj'
          )
          foreach ($proj in $projects) {
            msbuild $proj `
              /p:Configuration=${{ matrix.configuration }} `
              /p:Platform=x64 `
              /p:PlatformToolset=${{ matrix.compiler == 'MSVC' && 'v145' || 'ClangCL' }} `
              "/p:SolutionDir=$solutionDir" `
              /p:SolutionName=runtime `
              "/p:SolutionPath=$solutionPath" `
              /p:BuildProjectReferences=false `
              /m `
              /v:minimal `
              /nologo
            if ($LASTEXITCODE -ne 0) { throw "テストプロジェクトのビルドに失敗: $proj" }
          }

      # OutDir は nox_common.props が build\$(SolutionName)\$(Platform)\$(Configuration)\
      # と決めているので、runtime.slnx の出力はここに落ちる。
      # gtest.dll は各テスト vcxproj の PostBuildEvent が隣へ置く。
      - name: Run GoogleTest suites
        id: gtest
        if: matrix.configuration != 'Master'
        run: |
          $outDir = 'runtime\build\runtime\x64\${{ matrix.configuration }}'
          New-Item -ItemType Directory -Force test-results | Out-Null

          $failed = @()
          foreach ($name in 'kernel_test', 'core_test') {
            $exe = Join-Path $outDir "$name.exe"
            if (-not (Test-Path $exe)) { throw "テスト実行ファイルが無い: $exe" }
            & $exe --gtest_output="xml:test-results/$name.xml" 2>&1 |
              Tee-Object -FilePath "test-results/$name.txt"
            if ($LASTEXITCODE -ne 0) { $failed += "$name (exit $LASTEXITCODE)" }
          }

          # 1 本でも失敗したらこのジョブを落とす。これがテストゲート
          if ($failed.Count -gt 0) { throw ("失敗したテスト: " + ($failed -join ', ')) }

      # gtest は「1 件も走らなくても」 exit 0 を返す。テスト登録の漏れや
      # フィルタの書き間違いでスイートが丸ごと消えても緑になり、
      # 「通った」と誤読される。件数を数えるのが唯一の証明。
      # 実測は kernel_test 21 + core_test 81 = 102 件。その 9 割を下限に置く。
      - name: 実行件数を確かめる
        if: always() && matrix.configuration != 'Master'
        shell: pwsh
        run: |
          python .github/scripts/check-test-results.py test-results --min 91 --label GoogleTest

      # ---------------------------------------------------------
      # Benchmark (runtime/bench/bench_test.exe)
      #
      # 6 構成すべてで建てる。Master も建てるのは、出荷構成でコンパイルが通ることの
      # 確認を兼ねるため (テストは Master で建たないので、ここが唯一の確認になる)。
      # テストと同じく runtime.slnx の外で、msbuild の呼び出しも分けて建てる。
      # Release / Master の /GL で reflection_generated.lib を共有する exe を
      # 同時にリンクすると衝突するため (上の「Build test projects」の説明を参照)。
      #
      # 計測は Release / Master だけ。Debug は --smoke で各ベンチを 1 回ずつ通し、
      # アサートに掛からないことだけを見る。
      # 比較元は master で建てた bench_test.exe (アーティファクト bench-exe-<構成>)。
      # 同じ VM で交互に走らせるので、ランナーの CPU が毎回違っても差が取れる。
      # 仕組みと判定の詳細は .github/scripts/bench-run.py の先頭を参照。
      #
      # 時間の変化では CI を落とさない (共有ランナーの揺れで誤判定するため)。
      # 確保回数は揺れないので、予算を超えたとき (終了コード 3) だけ落とす。
      # ---------------------------------------------------------
      - name: Build bench_test
        id: bench-build
        if: always() && steps.build.outcome == 'success'
        run: |
          $solutionDir  = (Resolve-Path 'runtime').Path.Replace('\', '/') + '/'
          $solutionPath = $solutionDir + 'runtime.slnx'
          msbuild runtime\bench\bench_test.vcxproj `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:PlatformToolset=${{ matrix.compiler == 'MSVC' && 'v145' || 'ClangCL' }} `
            "/p:SolutionDir=$solutionDir" `
            /p:SolutionName=runtime `
            "/p:SolutionPath=$solutionPath" `
            /p:BuildProjectReferences=false `
            /m `
            /v:minimal `
            /nologo
          if ($LASTEXITCODE -ne 0) { throw "bench_test のビルドに失敗 (exit $LASTEXITCODE)" }

      - name: Run benchmarks
        id: bench
        if: always() && steps.bench-build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          # Windows の Python は既定で cp1252 を使い、日本語の入出力で落ちる
          PYTHONUTF8: '1'
        run: |
          $benchArgs = @(
            '--exe', 'runtime\build\runtime\x64\${{ matrix.configuration }}\bench_test.exe',
            '--compiler', '${{ matrix.compiler }}',
            '--config', '${{ matrix.configuration }}',
            '--out-dir', 'bench-out',
            '--summary', $env:GITHUB_STEP_SUMMARY
          )
          if ('${{ matrix.configuration }}' -eq 'Debug') { $benchArgs += '--smoke' } else { $benchArgs += @('--base', 'auto') }
          python .github/scripts/bench-run.py @benchArgs
          if ($LASTEXITCODE -ne 0) { throw "ベンチマークが失敗 (exit $LASTEXITCODE)" }

      - name: Upload benchmark result
        if: always() && steps.bench-build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: bench-result-${{ matrix.compiler }}-${{ matrix.configuration }}
          path: bench-out/result.json
          if-no-files-found: warn

      # 後続の push が比較元として取りに来る。master のものだけ長く残す
      - name: Upload bench_test.exe
        if: always() && steps.bench-build.outcome == 'success' && matrix.configuration != 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: bench-exe-${{ matrix.compiler }}-${{ matrix.configuration }}
          path: runtime/build/runtime/x64/${{ matrix.configuration }}/bench_test.exe
          retention-days: ${{ github.ref == 'refs/heads/master' && 90 || 7 }}
          if-no-files-found: warn

      # ---------------------------------------------------------
      # Editor UI test (FlaUI, MIT)
      #
      # Studio.Wpf.exe を実際に起動し、主要パネルの表示・テーマ切替・
      # Hierarchy / Inspector / AssetBrowser の操作を UI Automation で確かめる。
      # ビルドが通っても「起動したら DataContext が繋がっていない」類の破損は
      # ここでしか拾えない。
      #
      # このジョブに同居させている理由: Editor は起動時に ReflectionGenerator が
      # 書き出す RuntimeTypeDB.x64.<構成>.bin (約 150MB) を読む。それは上の
      # runtime.slnx のビルドで生成済みなので、別ジョブに分けて巨大な
      # アーティファクトを受け渡すより、ここで続けて走らせる方が安い。
      # 場所は環境変数 NOX_RUNTIME_TYPEDB_DIR で明示し、%TEMP% のポインタ
      # ファイルには頼らない。
      #
      # ClangCL では走らせない。FlaUI が見るのは C# 側の挙動で、C++ の
      # ツールセットには依存しないため、2 回回しても得るものが無い。
      #
      # Editor が参照する runtime の構成は NOX_RUNTIME_CONFIGURATION で渡す。
      # Core.RuntimeConfiguration.ResolveDefault() がこれを読み、
      # RuntimeTypeDB.x64.<構成>.bin と runtime.exe の置き場を決める。
      # 既定値は Debug のままなので、人の手元の使い勝手は変わらない
      # (Editor を Release で建てて runtime は Debug、という組み合わせは普通にある)。
      # CI は 1 ジョブ 1 構成しか建てないので、明示的に揃える必要がある。
      #
      # Editor と runtime.exe の接続テスト (RebootButtonLaunchesRuntimeAndHostsWindowInRuntimeView)
      # もここで走る。Reboot で runtime.exe を起こし、GetMainSceneView の往復で
      # ウィンドウハンドルを受け取って RuntimeView に取り込めるまでを確かめる。
      # 他の UI テストと同じくゲートとして扱い、continue-on-error は付けない。
      # GitHub ホストの windows ランナーは対話デスクトップを持つので FlaUI が動く。
      # セルフホストへ回す場合はサービスではなく対話セッションで動かすこと。
      # ---------------------------------------------------------
      - name: Verify RuntimeTypeDB exists
        if: always() && matrix.compiler == 'MSVC' && matrix.configuration != 'Master'
        run: |
          $bin = 'runtime/reflection_generated/gen/RuntimeTypeDB.x64.${{ matrix.configuration }}.bin'
          if (-not (Test-Path $bin)) { throw "TypeDB が無い: $bin (runtime.slnx の ${{ matrix.configuration }} ビルドで生成されるはず)" }
          Write-Host ("TypeDB: {0} ({1:N0} bytes)" -f $bin, (Get-Item $bin).Length)

      # FlaUI は Editor/Studio.Wpf/bin/<構成>/net10.0-windows/Studio.Wpf.exe を
      # リポジトリルートからの相対で探す (EditorApp.ResolveBuildConfiguration が
      # テスト自身の出力ディレクトリから構成名を導く) ので、同じ構成で建てる。
      - name: Build Editor/Studio.slnx
        if: always() && matrix.compiler == 'MSVC' && matrix.configuration != 'Master'
        run: |
          dotnet build Editor/Studio.slnx -c ${{ matrix.configuration }} --no-incremental -v minimal
          if ($LASTEXITCODE -ne 0) { throw "Editor のビルドに失敗 (exit $LASTEXITCODE)" }

      - name: Run FlaUI tests
        if: always() && matrix.compiler == 'MSVC' && matrix.configuration != 'Master'
        id: flaui
        env:
          NOX_RUNTIME_TYPEDB_DIR: ${{ github.workspace }}/runtime/reflection_generated/gen
          NOX_RUNTIME_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          dotnet test Editor/Studio.Wpf.UITests/Studio.Wpf.UITests.csproj -c ${{ matrix.configuration }} --no-build -v minimal `
            --blame-hang-timeout 5m `
            --logger "trx;LogFileName=flaui.trx" --results-directory flaui-results
          if ($LASTEXITCODE -ne 0) { throw "FlaUI テストに失敗 (exit $LASTEXITCODE)" }

      # ---------------------------------------------------------
      # 要約とアーティファクト
      #
      # アーティファクト名にはマトリクスの値を必ず含めること。6 ジョブが
      # 同じ名前で上げると upload-artifact が衝突して落ちる。
      # ---------------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          $ok = '${{ steps.build.outcome }}' -eq 'success'
          $icon = if ($ok) { ':white_check_mark:' } else { ':x:' }
          $status = if ($ok) { 'Build succeeded' } else { 'Build failed' }

          @"
          ## $icon Build (${{ matrix.compiler }} / ${{ matrix.configuration }})

          | Item     | Value                                |
          |----------|--------------------------------------|
          | Solution | runtime.slnx                         |
          | Toolset  | ${{ matrix.compiler == 'MSVC' && 'v145' || 'ClangCL' }} |
          | Config   | ${{ matrix.configuration }} \| x64    |
          | Result   | **$status**                          |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # 失敗時は build.log からエラー行を拾って貼る
          if (-not $ok -and (Test-Path build.log)) {
            $errors = Select-String -Path build.log -Pattern ': error |: fatal error ' |
              ForEach-Object { ($_.Line -replace '^\s*\d+>', '').Trim() } |
              Select-Object -Unique | Select-Object -First 20
            if ($errors) {
              "`n### Errors (unique, first 20)`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              $errors | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

      - name: Write test summary
        if: always() && matrix.configuration != 'Master'
        run: |
          $ok = '${{ steps.gtest.outcome }}' -eq 'success'
          $icon = if ($ok) { ':white_check_mark:' } else { ':x:' }
          $lines = @('', "## $icon GoogleTest (${{ matrix.compiler }} / ${{ matrix.configuration }})", '')

          # gtest の XML から件数と失敗したテスト名を拾う。
          # レポート用のアクションを足すほどの規模ではないので自前で読む
          foreach ($name in 'kernel_test', 'core_test') {
            $lines += "### $name", ''
            $xmlPath = "test-results/$name.xml"
            if (Test-Path $xmlPath) {
              $s = ([xml](Get-Content $xmlPath -Raw)).testsuites
              $lines += '| Tests | Failures | Errors | Disabled | Time |'
              $lines += '|-------|----------|--------|----------|------|'
              $lines += "| $($s.tests) | $($s.failures) | $($s.errors) | $($s.disabled) | $($s.time)s |"

              $failed = $s.testsuite.testcase |
                Where-Object { $_.failure -or $_.error } |
                ForEach-Object { "$($_.classname).$($_.name)" }
              if ($failed) {
                $lines += '', '#### Failed', '```'
                $lines += $failed
                $lines += '```'
              }
            } else {
              $lines += '_XML レポートが出力されていない (実行前に落ちた可能性)_'
            }

            # 標準出力の締めくくり ([==========] / [  PASSED  ] / [  FAILED  ]) も残す
            if (Test-Path "test-results/$name.txt") {
              $tail = Select-String -Path "test-results/$name.txt" `
                -Pattern '^\[==========\]|^\[  PASSED  \]|^\[  FAILED  \]' |
                ForEach-Object { $_.Line } | Select-Object -Last 15
              if ($tail) {
                $lines += '', '#### gtest output', '```'
                $lines += $tail
                $lines += '```'
              }
            }
            $lines += ''
          }

          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # trx を読んで件数を要約する。0 件の緑は緑ではないので、実行数も見る
      - name: Write FlaUI summary
        if: always() && matrix.compiler == 'MSVC' && matrix.configuration != 'Master'
        run: |
          $ok = '${{ steps.flaui.outcome }}' -eq 'success'
          $icon = if ($ok) { ':white_check_mark:' } else { ':x:' }
          $lines = @('', "## $icon Editor UI test (FlaUI / ${{ matrix.configuration }})", '')
          $trx = Get-ChildItem flaui-results -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trx) {
            [xml]$x = Get-Content $trx.FullName
            $c = $x.TestRun.ResultSummary.Counters
            $lines += "| 実行 | 合格 | 失敗 | 合計 |"
            $lines += "| --- | --- | --- | --- |"
            $lines += "| $($c.executed) | $($c.passed) | $($c.failed) | $($c.total) |"
            $bad = $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' }
            foreach ($r in $bad) { $lines += "- ``$($r.testName)``: $($r.outcome)" }
            if ([int]$c.executed -lt 10) { $lines += ''; $lines += ':warning: 実行数が少なすぎる。フィルタか検出の設定を疑うこと。' }
          } else {
            $lines += ':warning: trx が見つからない (テストランナーが起動していない)'
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Studio.Wpf.exe が起動直後に落ちた場合、FlaUI 側には「プロセスが居ない」
      # としか残らない。理由は Windows のイベントログ (.NET Runtime の未処理例外、
      # Application Error) にあるので、直近分を拾って summary とアーティファクトに残す。
      - name: Collect Editor crash diagnostics
        if: always() && matrix.compiler == 'MSVC' && matrix.configuration != 'Master'
        run: |
          $since = (Get-Date).AddMinutes(-30)
          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
            Select-Object -First 20
          New-Item -ItemType Directory -Force flaui-results | Out-Null
          $out = foreach ($e in $events) { "=== [$($e.TimeCreated)] $($e.ProviderName) (Id $($e.Id))"; $e.Message; '' }
          if (-not $out) { $out = @('(該当するイベントなし)') }
          $out | Out-File -FilePath flaui-results/crash-events.txt -Encoding utf8
          if ($events) {
            $lines = @('', '### Editor crash diagnostics (Application event log)', '', '```')
            $lines += ($out | Select-Object -First 60)
            $lines += '```'
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      # 要約に載らない前後の文脈を追いたいことがあるので、失敗時だけ全文を残す
      - name: Upload build log
        # ジョブが落ちた後でも走らせたいので always() で判定する
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.compiler }}-${{ matrix.configuration }}
          path: build.log
          if-no-files-found: warn

      - name: Upload test results
        if: always() && matrix.configuration != 'Master'
        uses: actions/upload-artifact@v7
        with:
          name: gtest-results-${{ matrix.compiler }}-${{ matrix.configuration }}
          path: test-results/
          if-no-files-found: warn

      # trx は実行ユーザー名と絶対パスを含むので、リポジトリには入れず
      # アーティファクトにだけ残す (.gitignore でも除外している)
      - name: Upload FlaUI results
        if: always() && matrix.compiler == 'MSVC' && matrix.configuration != 'Master'
        uses: actions/upload-artifact@v7
        with:
          name: flaui-results-${{ matrix.configuration }}
          path: flaui-results/
          if-no-files-found: warn

  # =========================================================
  # Editor: C# (WPF) 側の Editor/Studio.slnx を建てる
  #
  # ここが無かったせいで、Editor/Core/Core.csproj が RuntimeTypeDB を
  # .gitignore 済みの Release 出力への HintPath で参照しており
  # clone 直後は必ず壊れる、という状態に誰も気付けなかった。
  # (導入コミットから発覚まで手付かず。ローカルにたまたま古い DLL が
  #  残っているマシンでだけ通っていた)
  #
  # runtime とは依存が全く別 (MSBuild / vcpkg / v145 のいずれも不要で
  # .NET SDK だけで建つ) ので、setup-nox-build は使わず独立させている。
  # Debug と Release の両方を建てるのは、構成ごとに参照解決が変わる
  # 類の破損を今度こそ拾うため。
  #
  # build マトリクスの MSVC ジョブも FlaUI の前に Editor を建てるので、
  # 通常の push では C# のビルドが二重になる。それでも残しているのは 2 つ理由がある。
  #   - 速い。C# だけなら 1 分半で分かる。build マトリクスは 8〜10 分かかる
  #   - dependabot/nuget では build マトリクスが MSVC/Debug だけに縮むので、
  #     Release の C# ビルドを担保できるのがここだけになる
  # 重複するのは dotnet build 2 回ぶん (約 45 秒) で、消した Debug の
  # フルビルド (約 7 分) とは桁が違う。
  # =========================================================
  editor:
    name: Build Editor (C#)
    # 既定は GitHub ホストの windows-latest。リポジトリ変数 NOX_RUNNER を
    # 設定するとそちらへ回す (例: NOX_RUNNER=self-hosted)。セルフホストの
    # 実行時間は無料枠を消費しないので、6 構成を毎 push で建てるならこれ。
    # 手元は VS2026 (v145) が入っている前提。
    runs-on: ${{ vars.NOX_RUNNER || 'windows-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # --no-incremental を付けているのは、参照解決の破損は差分ビルドだと
      # 前回の出力が残っていて見逃されることがあるため
      - name: Build Editor/Studio.slnx
        id: build
        run: |
          $failed = @()
          foreach ($cfg in 'Debug', 'Release') {
            dotnet build Editor\Studio.slnx -c $cfg --no-incremental -v minimal 2>&1 |
              Tee-Object -FilePath "editor-$cfg.log"
            if ($LASTEXITCODE -ne 0) { $failed += "$cfg (exit $LASTEXITCODE)" }
          }
          if ($failed.Count -gt 0) { throw ("失敗した構成: " + ($failed -join ', ')) }

      - name: Write job summary
        if: always()
        run: |
          $ok = '${{ steps.build.outcome }}' -eq 'success'
          $icon = if ($ok) { ':white_check_mark:' } else { ':x:' }
          $lines = @("## $icon Editor (C#)", '')

          foreach ($cfg in 'Debug', 'Release') {
            $log = "editor-$cfg.log"
            if (-not (Test-Path $log)) { continue }
            # dotnet build の締めくくり (「N 個の警告」「N エラー」) を拾う
            $tail = Get-Content $log | Select-String -Pattern '警告|エラー|Warning\(s\)|Error\(s\)' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Last 2
            $lines += "- **$cfg**: $($tail -join ' / ')"
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload build log
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: editor-build-log
          path: editor-*.log
          if-no-files-found: warn

  # =========================================================
  # Build insights: 各構成のビルド計測をまとめ、レポート (単一 HTML) と要約を作る
  #
  # build マトリクスの MSVC ジョブが上げた build-insights-MSVC-<構成> を集め、
  # .github/scripts/build-insights-report.py でレポートにする。
  #   - build-insights-report.html: 1 ファイルで開けるレポート (zip にせず上げる。
  #     upload-artifact は archive: false のときファイル名をアーティファクト名にする)
  #   - build-insights-data: 次の実行の比較元 (master のものだけを比較に使う)
  #   - build-insights-site: bench-publish が GitHub Pages の /build-insights/ に置く
  # 比較元は「今回以外で、期限の切れていない master の build-insights-data の最新」。
  # 計測が 1 つも無いとき (全構成で計測に失敗した等) は要約にそう書くだけで落とさない。
  # =========================================================
  build-insights:
    name: Build Insights report
    needs: [build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # 比較元 (master の build-insights-data) を探して取るため
      pages: read     # 公開先の URL を要約に載せるため

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            tools/build-insights/site

      # 無い構成があっても (計測の失敗・dependabot/nuget の縮小マトリクス) 取れた分で進める
      - name: Download measurements
        uses: actions/download-artifact@v8
        with:
          pattern: build-insights-MSVC-*
          path: bi-data
          merge-multiple: true

      - name: Restore baseline (latest master)
        id: base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if json=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=build-insights-data&per_page=100"); then
            pick=$(jq -r --arg run "$GITHUB_RUN_ID" '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "master" and ((.workflow_run.id | tostring) != $run))][0] | if . then "\(.workflow_run.id) \(.workflow_run.head_sha)" else "" end' <<<"$json")
            if [ -n "$pick" ]; then
              run_id=${pick%% *}
              sha=${pick#* }
              if gh run download "$run_id" -n build-insights-data -D bi-base; then
                echo "sha=$sha" >> "$GITHUB_OUTPUT"
                echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
                echo "比較元: run $run_id ($sha)"
              else
                echo "::warning::比較元の build-insights-data を取得できなかった (run $run_id)。差分なしで作る"
              fi
            else
              echo "比較元 (master の build-insights-data) はまだ無い"
            fi
          else
            echo "::warning::build-insights-data の一覧を取得できなかった。差分なしで作る"
          fi

      - name: Build report
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_RUN_URL: ${{ steps.base.outputs.run_url }}
        shell: bash
        run: |
          mkdir -p bi-report
          python3 .github/scripts/build-insights-report.py \
            --data-dir bi-data --base-dir bi-base \
            --base-sha "$BASE_SHA" --base-run-url "$BASE_RUN_URL" \
            --site-src tools/build-insights/site \
            --out-html bi-report/build-insights-report.html
          if compgen -G 'bi-data/bi-*.json' > /dev/null; then echo "has_data=true" >> "$GITHUB_ENV"; fi

      - name: Upload report
        id: upload-report
        uses: actions/upload-artifact@v7
        with:
          path: bi-report/build-insights-report.html
          archive: false
          retention-days: 30

      - name: Write summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_RUN_URL: ${{ steps.base.outputs.run_url }}
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          EXPECT: ${{ startsWith(github.ref, 'refs/heads/dependabot/nuget/') && 'Debug' || 'Debug,Release,Master' }}
        run: |
          python3 .github/scripts/build-insights-report.py \
            --data-dir bi-data --base-dir bi-base \
            --base-sha "$BASE_SHA" --base-run-url "$BASE_RUN_URL" \
            --report-url "$REPORT_URL" --expect "$EXPECT" \
            --skip-html --summary "$GITHUB_STEP_SUMMARY"
          # master では bench-publish が GitHub Pages にも置く
          if [ "$GITHUB_REF" = "refs/heads/master" ] && url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq 'select(.build_type == "workflow") | .html_url' 2>/dev/null) && [ -n "$url" ]; then
            echo "公開後は ${url%/}/build-insights/ でも見られる (master の最新)。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 比較元として読むのは master のものだけなので、master でだけ上げる
      # (全ブランチで上げると、一覧の上位が作業ブランチのもので埋まり master のものを探しにくくなる)
      - name: Upload data (baseline for later runs)
        if: env.has_data == 'true' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: build-insights-data
          path: bi-data/
          retention-days: 90

      # bench-publish が GitHub Pages の /build-insights/index.html に置く
      - name: Prepare site
        if: env.has_data == 'true'
        run: |
          mkdir -p bi-site
          cp bi-report/build-insights-report.html bi-site/index.html
        shell: bash

      - name: Upload site artifact
        if: env.has_data == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-insights-site
          path: bi-site/
          retention-days: 90

  # =========================================================
  # Benchmark publish: 各構成の計測結果を履歴へ積み、結果ページを作り直す
  #
  # 中身は bench-publish.yml (ページだけの変更でも単独で走らせたいので分けてある)。
  # ビルドやテストが一部転んでも、計測できた構成の結果は載せたいので always() で呼ぶ。
  # master では GitHub Pages へ公開し、それ以外のブランチでは master の履歴に
  # 今回の結果を重ねたプレビューをアーティファクト bench-site に置く。
  # pages / id-token は公開ジョブ (master のみ) が使う。
  # =========================================================
  # build-insights も待つのは、その結果 (build-insights-site) を Pages の /build-insights/ に
  # 一緒に置くため。build-insights が落ちてもベンチマークの公開は止めない。
  bench-publish:
    name: Benchmark publish
    needs: [build, build-insights]
    if: always() && !cancelled()
    uses: ./.github/workflows/bench-publish.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    secrets: inherit
    with:
      measured: true

  # =========================================================
  # Notify: 転んだとき / 転んだ状態から戻ったときだけ Discord に流す
  #
  # GitHub 既定のメール通知の置き換え。成功が続いている間は無言なので、
  # 流れてきた時点で「見るべきものがある」と判断できる。
  #
  # webhook は org secret DISCORD_WEBHOOK_URL を参照する。未設定の
  # リポジトリでは黙ってスキップし、CI 自体は落とさない。
  #
  # pull_request を除外しているのは、同一リポジトリのブランチなら push 側で
  # 同じ内容が流れるため。フォークからの PR ではそもそも secret が読めない。
  # =========================================================
  notify:
    name: Notify Discord
    # bench-publish も含める。含めないと、結果ページの生成・公開が落ちても通知されず、
    # 次の成功で「復旧」だけが流れる。
    # build-insights も同じ理由で含める (レポートの生成が落ちたら気付きたい。計測自体の失敗は
    # ビルドの合否に影響させず、警告として要約に出る)。
    needs: [build, editor, build-insights, bench-publish]
    # 判定は step 側で needs.*.result を見るので、ここでは always() で拾うだけ。
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # 直前の実行結果 (復旧判定) と失敗ジョブ一覧の取得に要る

    steps:
      # 今回の結果と「直前の完了実行」の結果を突き合わせて、
      # failure / recovered / none のどれかに落とす。
      - name: Decide whether to notify
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          $results = ($env:RESULTS -split '\s+') | Where-Object { $_ }
          Write-Host "needs results: $($results -join ', ')"

          $kind = 'none'
          if ($results -contains 'cancelled') {
            # concurrency の打ち切り。人為的な中断なので通知しない
            Write-Host 'cancelled が含まれるので通知しない'
          }
          elseif ($results -contains 'failure') {
            $kind = 'failure'
          }
          else {
            # 全部 success (skipped 含む)。直前の完了実行が failure なら復旧
            $repo = $env:GITHUB_REPOSITORY
            $branch = [uri]::EscapeDataString($env:GITHUB_REF_NAME)
            $runId = [int64]$env:GITHUB_RUN_ID
            $prev = gh api "repos/$repo/actions/workflows/ci.yml/runs?branch=$branch&status=completed&per_page=20" `
              --jq '[.workflow_runs[] | {id, conclusion}]' | ConvertFrom-Json |
              Where-Object { $_.id -lt $runId -and $_.conclusion -in @('success', 'failure') } |
              Select-Object -First 1

            if ($prev -and $prev.conclusion -eq 'failure') {
              $kind = 'recovered'
              Write-Host "直前の完了実行 (run $($prev.id)) が failure だったので復旧通知"
            } else {
              Write-Host "直前の完了実行: $(if ($prev) { $prev.conclusion } else { 'なし' })。通知しない"
            }
          }

          "kind=$kind" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Post to Discord
        if: steps.decide.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KIND: ${{ steps.decide.outputs.kind }}
        run: |
          if (-not $env:WEBHOOK) {
            Write-Host '::warning::DISCORD_WEBHOOK_URL が未設定なので通知をスキップする'
            exit 0
          }

          $repo   = $env:GITHUB_REPOSITORY
          $runId  = $env:GITHUB_RUN_ID
          $sha    = $env:GITHUB_SHA
          $runUrl = "$env:GITHUB_SERVER_URL/$repo/actions/runs/$runId"

          # コミットの件名。push 以外 (schedule / workflow_dispatch) でも取れるよう
          # イベントペイロードではなく API から引く
          $subject = (gh api "repos/$repo/commits/$sha" --jq '.commit.message' 2>$null) -split "`n" | Select-Object -First 1
          if (-not $subject) { $subject = '(コミットメッセージ取得失敗)' }

          $fields = @(
            @{ name = 'ブランチ'; value = "``$env:GITHUB_REF_NAME``"; inline = $true }
            @{ name = 'きっかけ'; value = "``$env:GITHUB_EVENT_NAME``"; inline = $true }
            @{ name = 'コミット'; value = "[``$($sha.Substring(0,7))``]($env:GITHUB_SERVER_URL/$repo/commit/$sha) $subject"; inline = $false }
          )

          if ($env:KIND -eq 'failure') {
            $title = ":x: CI 失敗 — $repo"
            $color = 14687012   # 赤
            $failed = gh api "repos/$repo/actions/runs/$runId/jobs?per_page=100" `
              --jq '.jobs[] | select(.conclusion == "failure") | .name'
            if ($failed) {
              $fields += @{ name = '落ちたジョブ'; value = (($failed | ForEach-Object { "- $_" }) -join "`n"); inline = $false }
            }
          } else {
            $title = ":white_check_mark: CI 復旧 — $repo"
            $color = 3055683    # 緑
          }

          $payload = @{
            username = 'GitHub Actions'
            embeds = @(
              @{
                title       = $title
                url         = $runUrl
                color       = $color
                fields      = $fields
                footer      = @{ text = "$env:GITHUB_WORKFLOW #$env:GITHUB_RUN_NUMBER" }
                timestamp   = (Get-Date).ToUniversalTime().ToString('o')
              }
            )
          } | ConvertTo-Json -Depth 6 -Compress

          Invoke-RestMethod -Uri $env:WEBHOOK -Method Post `
            -ContentType 'application/json; charset=utf-8' -Body $payload | Out-Null
          Write-Host "Discord に通知した ($env:KIND)"
