# gitleaks の設定。既定ルール一式を継承した上で、このリポジトリ固有の
# 誤検知だけを除外する。
#
# 除外を足すときは必ず理由をコメントで残すこと。「うるさいから消した」
# だけの除外が積み上がると、この仕組み自体が意味を失う。

[extend]
useDefault = true

# Discord の Webhook URL。ci.yml / file-format.yml / clang-tidy.yml / dev-report.yml の通知先
# (secret の DISCORD_WEBHOOK_URL / DISCORD_DEV_REPORT_WEBHOOK_URL) として実際に使っている。
# URL を知っていれば誰でもそのチャンネルへ投稿できるのに、既定ルールには Discord の
# トークン類しか無く、Webhook URL は素通りしていた。tools/git-hooks/scan.sh にも同じ形を足してある。
[[rules]]
id = "discord-webhook-url"
description = "Discord Webhook URL"
regex = '''https://(?:(?:canary|ptb)\.)?discord(?:app)?\.com/api/(?:v\d+/)?webhooks/\d{17,20}/[A-Za-z0-9_-]{60,}'''
keywords = ["discord"]

[allowlist]
description = "Nox 固有の除外"

paths = [
  # スキャナ自身。検出パターンの見本を持っているので必ず引っかかる。
  '''tools/git-hooks/scan\.sh''',
  '''\.gitleaks\.toml''',
]

regexes = [
  # Windows SDK が生成する MSIX のライセンス XML に含まれる
  # <KeyInfo Id="..."> は署名構造の識別子であって秘密情報ではない。
  # obj/ は追跡対象外なので通常は現れないが、過去に混入した実績がある。
  '''KeyInfo Id=''',
]
